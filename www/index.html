<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dr Trams Test App</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container">
    <h1>🔥 Dr Trams Hybrid Test</h1>

    <p id="info">Loading device info...</p>

    <button onclick="showDeviceInfo()">📱 Device Info</button>
    <button onclick="showAlert()">⚡ Test JS</button>
    <button onclick="testNotification()">🔔 Notification Test</button>
  </div>

  <script src="js/app.js"></script>

  <!-- Cordova / Capacitor auto inject -->
  <script>
    document.addEventListener("deviceready", function () {
      document.getElementById("info").innerText = "✅ Native Bridge Connected!";
    }, false);
  </script>
</body>
</html>
