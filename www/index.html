<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dr Trams Test App</title>
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <div class="container">
    <h1>🔥 Dr Trams Hybrid App</h1>

    <p id="status">Waiting for device...</p>

    <button onclick="showDevice()">📱 Device Info</button>
    <button onclick="testJS()">⚡ Test JS</button>
    <button onclick="testNotification()">🔔 Notification</button>
  </div>

  <!-- JS FILES -->
  <script src="js/index.js"></script>

  <!-- Cordova / Capacitor Bridge -->
  <script>
    document.addEventListener("deviceready", function () {
      document.getElementById("status").innerText = "✅ Native Bridge Connected";
    }, false);
  </script>
</body>
</html>
